<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - 페이지를 찾을 수 없습니다 | 차를 쓰다</title>
    <meta name="robots" content="noindex, follow">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Pretendard Variable", Pretendard, "Noto Sans KR", sans-serif;
            background: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
        }
        .error-card {
            max-width: 480px;
            width: 100%;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 20px;
            padding: 48px 28px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }
        .error-badge {
            display: inline-block;
            background: #334155;
            color: #38bdf8;
            font-size: 0.82rem;
            font-weight: 800;
            padding: 5px 14px;
            border-radius: 999px;
            margin-bottom: 16px;
        }
        .error-code {
            font-size: 5rem;
            font-weight: 900;
            line-height: 1;
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 12px;
            letter-spacing: -2px;
        }
        .error-title {
            font-size: 1.35rem;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 12px;
            line-height: 1.4;
        }
        .error-desc {
            font-size: 0.95rem;
            color: #94a3b8;
            line-height: 1.65;
            margin-bottom: 28px;
            word-break: keep-all;
        }
        .btn-home {
            display: inline-block;
            background: #38bdf8;
            color: #0f172a;
            font-weight: 800;
            font-size: 1rem;
            padding: 14px 32px;
            border-radius: 12px;
            text-decoration: none;
            transition: all 0.2s ease;
        }
        .btn-home:hover {
            background: #0284c7;
            color: #ffffff;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="error-card">
        <span class="error-badge">🚗 차를 쓰다 (CHAGEUL)</span>
        <div class="error-code">404</div>
        <h1 class="error-title">페이지를 찾을 수 없습니다</h1>
        <p class="error-desc">
            요청하신 칼럼의 주소가 변경되었거나 삭제되어 현재 찾을 수 없습니다.<br>
            입력하신 주소가 정확한지 다시 한번 확인해 주시기 바랍니다.
        </p>
        <a href="/" class="btn-home">차를 쓰다 홈으로 이동</a>
    </div>
</body>
</html>
