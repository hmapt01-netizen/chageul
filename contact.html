﻿<!DOCTYPE html>
<html lang="ko">
<head>
    <!-- 📊 Google Analytics 4 (GA4 공식 초광속 비동기 태그) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-V2RMP3SCRQ"></script>
    <script>
    async function handleContactSubmit(e) {
        e.preventDefault();
        const name = document.getElementById('contactName').value.trim();
        const email = document.getElementById('contactEmail').value.trim();
        const subject = document.getElementById('contactSubject').value;
        const message = document.getElementById('contactMessage').value.trim();
        const submitBtn = document.querySelector('#contactForm .btn-submit');
        const originalBtnText = submitBtn.innerText;

        submitBtn.innerText = '메일 발송 중... 🚀';
        submitBtn.disabled = true;
        submitBtn.style.opacity = '0.7';

        try {
            const response = await fetch('https://formsubmit.co/ajax/hmapt01@gmail.com', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Accept': 'application/json'
                },
                body: JSON.stringify({
                    _subject: '[차를 쓰다 문의] ' + subject + ' - ' + name + '님',
                    _template: 'table',
                    _captcha: 'false',
                    이름_담당자명: name,
                    회신_이메일: email,
                    문의_분류: subject,
                    문의_상세내용: message,
                    접수_시각: new Date().toLocaleString('ko-KR')
                })
            });

            const result = await response.json();
            
            document.getElementById('contactForm').reset();
            const successEl = document.getElementById('contactSuccessMsg');
            successEl.style.display = 'block';
            successEl.innerHTML = '✓ 소중한 문의 메시지가 편집국 담당자(hmapt01@gmail.com)에게 성공적으로 발송되었습니다. 신속히 검토 후 회신드리겠습니다.';
            window.scrollTo({ top: successEl.offsetTop - 80, behavior: 'smooth' });
        } catch (err) {
            console.error('Mail sending error:', err);
            const mailtoUrl = 'mailto:hmapt01@gmail.com?subject=' + encodeURIComponent('[차를 쓰다 문의] ' + subject + ' - ' + name) + '&body=' + encodeURIComponent('성함/담당자명: ' + name + '
회신 이메일: ' + email + '
문의 분류: ' + subject + '

문의 내용:
' + message);
            window.location.href = mailtoUrl;
        } finally {
            submitBtn.innerText = originalBtnText;
            submitBtn.disabled = false;
            submitBtn.style.opacity = '1';
        }
    }
</script>
<script src="js/features.js?v=20260829_car_theme" defer></script>

<script>
    // 📱 모바일 드로어 제어
    const btnOpen = document.getElementById('btnOpenMobileDrawer');
    const btnClose = document.getElementById('btnCloseMobileDrawer');
    const overlay = document.getElementById('drawerOverlay');
    const drawer = document.getElementById('naverMobileDrawer');

    if (btnOpen && drawer && overlay) {
        btnOpen.addEventListener('click', () => {
            drawer.classList.add('open');
            overlay.classList.add('open');
            document.body.style.overflow = 'hidden';
        });
        const closeMenu = () => {
            drawer.classList.remove('open');
            overlay.classList.remove('open');
            document.body.style.overflow = '';
        };
        if (btnClose) btnClose.addEventListener('click', closeMenu);
        overlay.addEventListener('click', closeMenu);
    }
</script>

</body>
</html>
